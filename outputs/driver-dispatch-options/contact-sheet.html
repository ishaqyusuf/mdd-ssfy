<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Driver Dispatch — Screen 1 Options</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #080a09; color: #f7faf8; font-family: Arial, sans-serif; }
    header { margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; color: #a8b0aa; font-size: 16px; }
    main { display: grid; grid-template-columns: repeat(2, 390px); gap: 22px; align-items: start; }
    figure { margin: 0; padding: 12px; background: #111411; border: 1px solid #303630; border-radius: 16px; }
    figcaption { min-height: 38px; padding: 2px 2px 10px; font-size: 18px; font-weight: 700; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; }
    footer { margin-top: 22px; color: #a8b0aa; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Driver Dispatch — Screen 1</h1>
    <p>Choose A, B, C, D, E, or retain the existing UI.</p>
  </header>
  <main>
    <figure><figcaption>A — Existing UI, tightened</figcaption><img src="option-a.png" alt="Option A"></figure>
    <figure><figcaption>B — Next stop first</figcaption><img src="option-b.png" alt="Option B"></figure>
    <figure><figcaption>C — Dense scan list</figcaption><img src="option-c.png" alt="Option C"></figure>
    <figure><figcaption>D — Exception-first queue</figcaption><img src="option-d.png" alt="Option D"></figure>
    <figure><figcaption>E — Day timeline</figcaption><img src="option-e.png" alt="Option E"></figure>
  </main>
  <footer>Reply with the letter you prefer.</footer>
</body>
</html>
